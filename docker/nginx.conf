server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Uploaded CSVs travel in the JSON request body; the API accepts up to 5MB.
  client_max_body_size 6m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The API is served from the same origin as the app on purpose: the session
  # cookie is httpOnly and SameSite=Lax, so a split origin would need CORS and
  # a SameSite=None cookie. Keeping one origin avoids both.
  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;  # Claude report generation is the slowest call
  }

  # Hashed asset filenames change on every build, so they are safe to cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths return the shell, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
