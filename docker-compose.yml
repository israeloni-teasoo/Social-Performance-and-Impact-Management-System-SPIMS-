# SPIMS, self-hosted. Everything runs on the client's own infrastructure; no
# component calls out to the vendor, and nobody outside this network can reach the
# database. See docs/SELF-HOSTING.md for the install and handover runbook.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spims}
    volumes:
      - spims-db:/var/lib/postgresql/data
    # Deliberately not published to the host: only the api service reaches Postgres.
    # Uncomment for a one-off restore or an external backup agent, then re-comment.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spims} -d ${POSTGRES_DB:-spims}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-spims}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spims}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Set to false only if this deployment is served over plain HTTP internally.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SEED_ON_START: ${SEED_ON_START:-false}
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8787/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  spims-db:
